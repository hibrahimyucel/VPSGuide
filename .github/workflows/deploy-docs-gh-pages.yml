name: Deploy docs to gh-pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Verify pnpm & node
        run: |
          pnpm -v
          node -v

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all --yes

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        run: |
          cd apps/docs
          pnpm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/docs/docs/.vitepress/dist
          # publish_branch: gh-pages   # opsiyonel: default v3 zaten gh-pages kullanır
