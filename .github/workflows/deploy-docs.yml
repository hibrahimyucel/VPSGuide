name: Deploy docs

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Verify pnpm & node
        run: |
          pnpm -v
          node -v

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all --yes

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        # Eğer package.json'daki name @myorg/docs ise filtre kullanın; değilse alternatif olarak cd apps/docs && pnpm run build kullanın.
        run: pnpm --filter @myorg/docs run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: apps/docs/docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
