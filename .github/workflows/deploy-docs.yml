name: Deploy docs

on:
  push:
    branches: [ main ]   # ana dalınız farklıysa bunu değiştirin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

      steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm (install & add to PATH)
        uses: pnpm/action-setup@v2
        with:
          version: latest    # veya belirli bir sürüm: '8' / '9.24.0' vb.

      - name: Verify pnpm
        run: |
          pnpm -v
          node -v

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all --yes

      - name: Install dependencies
        run: pnpm install      
        
      - name: Build docs
        run: |
          # Eğer package.json'daki name @myorg/docs ise filtre kullanın
          pnpm --filter @myorg/docs run build
          # Alternatif: cd apps/docs && pnpm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
