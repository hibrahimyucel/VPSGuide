name: Deploy docs

on:
  push:
    branches: [ main ]   # eğer farklı bir branch kullanıyorsanız burayı değiştirin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Approve pnpm build scripts (for esbuild etc.)
        run: pnpm approve-builds --all --yes

      - name: Install dependencies
        run: pnpm install

      - name: Build docs
        # Paket isminiz package.json'daki "name" alanına göre değişebilir.
        # Eğer @myorg/docs ise aşağıdaki filtre uygundur; değilse cd'leyip build yapın.
        run: pnpm --filter @myorg/docs run build
        # Alternatif (package name farklý ise):
        # run: |
        #   cd apps/docs
        #   pnpm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: apps/docs/docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
